name: Publish

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish the existing release artifacts
        required: true
        type: boolean
        default: false

env:
  SASE_PYTHON_REF: master
  SASE_RUST_CORE_REF: master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || 'false' }}
    steps:
      - uses: googleapis/release-please-action@v5
        if: ${{ github.event_name == 'push' }}
        id: release
        with:
          token: ${{ secrets.SASE_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_existing == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Python
        run: uv python install 3.12
      - name: Build package
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Check out SASE
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase
          ref: ${{ env.SASE_PYTHON_REF }}
          path: .sase-deps/sase
          token: ${{ secrets.SASE_RELEASE_TOKEN || github.token }}
      - name: Check out SASE Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          ref: ${{ env.SASE_RUST_CORE_REF }}
          path: .sase-deps/sase-core
          token: ${{ secrets.SASE_RELEASE_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v4
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        run: uv python install 3.12
      - name: Install built sase-research-artifacts wheel into a fresh venv
        run: |
          uv venv --python 3.12 /tmp/smoke-venv
          printf -- '-e %s\n' "$(realpath .sase-deps/sase)" > /tmp/sase-overrides.txt
          uv pip install --python /tmp/smoke-venv/bin/python --overrides /tmp/sase-overrides.txt dist/*.whl
          just install-source-sase /tmp/smoke-venv/bin/python
      - name: Smoke check
        run: |
          /tmp/smoke-venv/bin/python - <<'PY'
          from importlib.metadata import PackageNotFoundError, distribution, entry_points

          import sase_research_artifacts

          assert (
              distribution("sase-research-artifacts").metadata["Name"]
              == "sase-research-artifacts"
          )
          try:
              # Guard against accidentally installing the old distribution name.
              distribution("sase-research")
          except PackageNotFoundError:
              pass
          else:
              raise AssertionError("old sase-research distribution is installed")

          expected = {
              "sase_artifact_refs": {
                  "research": "sase_research_artifacts.provider:RESEARCH_REF_PROVIDER"
              },
              "sase_file_hooks": {
                  "research-highlights": "sase_research_artifacts.provider:RESEARCH_HIGHLIGHTS_HOOK"
              },
              "sase_config": {"sase_research_artifacts": "sase_research_artifacts"},
              "sase_xprompts": {"sase_research_artifacts": "sase_research_artifacts"},
          }

          discovered = entry_points()
          for group, entries in expected.items():
              group_entries = {
                  entry_point.name: entry_point.value
                  for entry_point in discovered.select(group=group)
              }
              for name, value in entries.items():
                  actual = group_entries.get(name)
                  if actual != value:
                      raise SystemExit(
                          f"{group} entry point {name!r}: expected {value!r}, got {actual!r}"
                      )

          assert sase_research_artifacts
          PY
      - name: Assemble the real artifact provider registry
        run: |
          /tmp/smoke-venv/bin/python - <<'PY'
          import sase.config  # avoid a circular import on a fresh interpreter
          from sase.artifact_providers import assemble_artifact_provider_registry

          registry = assemble_artifact_provider_registry()
          assert registry.diagnostics == (), registry.diagnostics
          assert "research" in registry.ref_providers_by_id
          assert "research-highlights" in registry.file_hook_providers_by_id
          PY

  install-smoke-published-minimum:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Install built wheel with published minimum dependencies
        run: |
          uv venv --python 3.12 /tmp/smoke-minimum-venv
          uv pip install --python /tmp/smoke-minimum-venv/bin/python "sase==0.17.2" "sase-core-rs==0.33.0" dist/*.whl
      - name: Smoke weighted research swarm on published floors
        run: |
          /tmp/smoke-minimum-venv/bin/python - <<'PY'
          import importlib.metadata

          import sase_core_rs
          import sase_research_artifacts
          from sase.agent.multi_prompt import split_segments_protecting_fences
          from sase.xprompt.directives import extract_prompt_directives
          from sase.xprompt.loader_sources import load_xprompts_from_plugins
          from sase.xprompt.processor import expand_single_xprompt

          assert importlib.metadata.version("sase") == "0.17.2"
          assert importlib.metadata.version("sase-core-rs") == "0.33.0"
          assert hasattr(sase_core_rs, "runner_capacity_snapshot")
          assert hasattr(sase_core_rs, "runner_capacity_policy_schema_version")
          assert sase_research_artifacts.RESEARCH_REF_PROVIDER

          xprompts = load_xprompts_from_plugins()
          research_swarm = xprompts["research_swarm"]
          assert research_swarm.content.count("%q(w=0.25") == 4
          assert "default: 16" not in research_swarm.content

          def assert_segments(named_args, *, runners=None, priority=None):
              body = expand_single_xprompt(
                  research_swarm,
                  ["wheel minimum smoke"],
                  named_args,
                  preserve_segment_separators=True,
              )
              segments = split_segments_protecting_fences(body)
              assert len(segments) == 4, segments
              for segment in segments:
                  assert segment.count("%q(") == 1
                  _, directives = extract_prompt_directives(segment)
                  assert directives.queue_weight == 0.25
                  assert directives.queue_weight_explicit is True
                  assert directives.wait_runners == runners
                  assert directives.wait_priority == priority

          assert_segments({})
          assert_segments({"runners": "0"}, runners=0)
          assert_segments({"priority": "0"}, priority=0)
          assert_segments({"wait": "upstream", "runners": "0", "priority": "5"}, runners=0, priority=5)
          print("PUBLISHED_MINIMUM_WHEEL_CONTRACT_OK")
          PY
      - name: Refuse older published SASE
        run: |
          set +e
          uv venv --python 3.12 /tmp/smoke-incompatible-venv
          output="$(uv pip install --python /tmp/smoke-incompatible-venv/bin/python "sase==0.17.1" dist/*.whl 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "expected old SASE floor install to fail" >&2
            exit 1
          fi
          grep -Eq "sase>=0\\.17\\.2|No solution|unsatisfiable|No matching distribution" <<< "$output"

  publish:
    needs: [release, build, install-smoke, install-smoke-published-minimum]
    if: ${{ needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_existing == true) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
