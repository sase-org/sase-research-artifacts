name: Publish

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish the existing release artifacts
        required: true
        type: boolean
        default: false

env:
  SASE_PYTHON_REF: master
  SASE_RUST_CORE_REF: master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || 'false' }}
    steps:
      - uses: googleapis/release-please-action@v5
        if: ${{ github.event_name == 'push' }}
        id: release
        with:
          token: ${{ secrets.SASE_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_existing == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Python
        run: uv python install 3.12
      - name: Build package
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Check out SASE
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase
          ref: ${{ env.SASE_PYTHON_REF }}
          path: .sase-deps/sase
          token: ${{ secrets.SASE_RELEASE_TOKEN || github.token }}
      - name: Check out SASE Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          ref: ${{ env.SASE_RUST_CORE_REF }}
          path: .sase-deps/sase-core
          token: ${{ secrets.SASE_RELEASE_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v4
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        run: uv python install 3.12
      - name: Install built sase-research-artifacts wheel into a fresh venv
        run: |
          uv venv --python 3.12 /tmp/smoke-venv
          printf -- '-e %s\n' "$(realpath .sase-deps/sase)" > /tmp/sase-overrides.txt
          uv pip install --python /tmp/smoke-venv/bin/python --overrides /tmp/sase-overrides.txt dist/*.whl
          just install-source-sase /tmp/smoke-venv/bin/python
      - name: Smoke check
        run: |
          /tmp/smoke-venv/bin/python - <<'PY'
          from importlib.metadata import PackageNotFoundError, distribution, entry_points

          import sase_research_artifacts

          assert (
              distribution("sase-research-artifacts").metadata["Name"]
              == "sase-research-artifacts"
          )
          try:
              # Guard against accidentally installing the old distribution name.
              distribution("sase-research")
          except PackageNotFoundError:
              pass
          else:
              raise AssertionError("old sase-research distribution is installed")

          expected = {
              "sase_artifact_refs": {
                  "research": "sase_research_artifacts.provider:RESEARCH_REF_PROVIDER"
              },
              "sase_file_hooks": {
                  "research-highlights": "sase_research_artifacts.provider:RESEARCH_HIGHLIGHTS_HOOK"
              },
              "sase_config": {"sase_research_artifacts": "sase_research_artifacts"},
              "sase_macros": {"sase_research_artifacts": "sase_research_artifacts"},
              "sase_xprompts": {"sase_research_artifacts": "sase_research_artifacts"},
          }

          discovered = entry_points()
          for group, entries in expected.items():
              group_entries = {
                  entry_point.name: entry_point.value
                  for entry_point in discovered.select(group=group)
              }
              for name, value in entries.items():
                  actual = group_entries.get(name)
                  if actual != value:
                      raise SystemExit(
                          f"{group} entry point {name!r}: expected {value!r}, got {actual!r}"
                      )

          assert sase_research_artifacts
          PY
      - name: Assemble the real artifact provider registry
        run: |
          /tmp/smoke-venv/bin/python - <<'PY'
          import sase.config  # avoid a circular import on a fresh interpreter
          from sase.artifact_providers import assemble_artifact_provider_registry

          registry = assemble_artifact_provider_registry()
          assert registry.diagnostics == (), registry.diagnostics
          assert "research" in registry.ref_providers_by_id
          assert "research-highlights" in registry.file_hook_providers_by_id
          PY

  install-smoke-published-minimum:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Install built wheel with published minimum dependencies
        run: |
          uv venv --python 3.12 /tmp/smoke-minimum-venv
          # lowest-direct pairs the floor sase with the lowest core allowed by both
          # sase's own published window and this plugin's floor, which is exactly
          # sase's published core floor.
          uv pip install --python /tmp/smoke-minimum-venv/bin/python --resolution lowest-direct "sase==0.18.0" "sase-core-rs>=0.35.0" dist/*.whl
      - name: Assert published floors
        run: |
          /tmp/smoke-minimum-venv/bin/python - <<'PY'
          import importlib.metadata

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import Version

          assert importlib.metadata.version("sase") == "0.18.0"

          installed_core = Version(importlib.metadata.version("sase-core-rs"))

          def core_requirement(raw_requirements):
              for raw in raw_requirements or []:
                  requirement = Requirement(raw)
                  if canonicalize_name(requirement.name) != "sase-core-rs":
                      continue
                  if requirement.marker is not None:
                      continue
                  return requirement
              raise AssertionError("missing sase-core-rs requirement")

          sase_core = core_requirement(importlib.metadata.requires("sase"))
          floors = [
              Version(item.version)
              for item in sase_core.specifier
              if item.operator in {">=", "=="}
          ]
          assert floors, sase_core
          assert installed_core == min(floors)

          plugin_core = core_requirement(
              importlib.metadata.requires("sase-research-artifacts")
          )
          assert installed_core in plugin_core.specifier
          PY
      - name: Smoke weighted research swarm on published floors
        run: |
          SASE_HOME="$(mktemp -d)" /tmp/smoke-minimum-venv/bin/python -I tests/wheel_smoke.py
      - name: Refuse older published SASE
        run: |
          set +e
          uv venv --python 3.12 /tmp/smoke-incompatible-venv
          output="$(uv pip install --python /tmp/smoke-incompatible-venv/bin/python "sase==0.17.1" dist/*.whl 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "expected old SASE floor install to fail" >&2
            exit 1
          fi
          grep -Eq "sase>=0\\.18\\.0|No solution|unsatisfiable|No matching distribution" <<< "$output"
      - name: Refuse older published core
        run: |
          set +e
          uv venv --python 3.12 /tmp/smoke-incompatible-core-venv
          output="$(uv pip install --python /tmp/smoke-incompatible-core-venv/bin/python "sase-core-rs==0.34.73" dist/*.whl 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "expected old core floor install to fail" >&2
            exit 1
          fi
          grep -Eq "sase-core-rs|No solution|unsatisfiable|No matching distribution" <<< "$output"

  publish:
    needs: [release, build, install-smoke, install-smoke-published-minimum]
    if: ${{ needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_existing == true) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
